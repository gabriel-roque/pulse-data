{{- range $component, $settings := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse.fullname" $ }}-{{ $component }}
  labels:
    {{- include "pulse.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
spec:
  replicas: {{ $settings.replicas }}
  strategy:
    type: {{ $.Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ $.Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ $.Values.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pulse.name" $ | quote }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pulse.name" $ | quote }}
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        app.kubernetes.io/component: {{ $component | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pulse
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "pulse.fullname" $ }}-config
            - secretRef:
                name: {{ include "pulse.fullname" $ }}-secret
          env:
            - name: PULSE_SERVICE
              value: {{ $component | quote }}
          {{- if $settings.port }}
          ports:
            - name: http
              containerPort: {{ $settings.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- else }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
{{- end }}
