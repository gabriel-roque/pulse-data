name: ${COMPOSE_PROJECT_NAME:-pulse}

x-pulse-environment: &pulse-environment
  PULSE_POSTGRES_DSN: ${PULSE_POSTGRES_DSN:-postgres://pulse:change-me-local@postgres:5432/pulse?sslmode=disable}
  PULSE_REDIS_URL: ${PULSE_REDIS_URL:-redis://redis:6379/0}
  PULSE_KAFKA_BROKERS: ${PULSE_KAFKA_BROKERS:-kafka:9092}
  PULSE_KAFKA_TOPIC: ${PULSE_KAFKA_TOPIC:-events.raw}
  PULSE_CLICKHOUSE_ADDR: ${PULSE_CLICKHOUSE_ADDR:-clickhouse:9000}
  PULSE_CLICKHOUSE_DATABASE: ${PULSE_CLICKHOUSE_DATABASE:-default}
  PULSE_ADMIN_TOKEN: ${PULSE_ADMIN_TOKEN:-change-me-admin}
  PULSE_RATE_LIMIT: ${PULSE_RATE_LIMIT:-1000}
  PULSE_RATE_WINDOW: ${PULSE_RATE_WINDOW:-1m}
  PULSE_MAX_PAYLOAD_BYTES: ${PULSE_MAX_PAYLOAD_BYTES:-1048576}
  PULSE_ALLOW_PRIVATE_WEBHOOKS: ${PULSE_ALLOW_PRIVATE_WEBHOOKS:-false}
  PULSE_METRICS_ADDR: ${PULSE_METRICS_ADDR:-:9091}

x-pulse-image: &pulse-image
  image: ${PULSE_IMAGE:-pulse:local}
  build:
    context: .
    dockerfile: deployments/docker/Dockerfile

# Compact local budget: approximately 2 vCPU and 3 GiB across steady-state
# services. These are containment limits, not a 100k events/s capacity claim.
x-pulse-ingestion-resources: &pulse-ingestion-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_INGESTION_CPU_LIMIT:-0.20}", memory: "${PULSE_INGESTION_MEMORY_LIMIT:-192M}"}
x-pulse-query-resources: &pulse-query-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_QUERY_CPU_LIMIT:-0.10}", memory: "${PULSE_QUERY_MEMORY_LIMIT:-128M}"}
x-pulse-ui-resources: &pulse-ui-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_UI_CPU_LIMIT:-0.05}", memory: "${PULSE_UI_MEMORY_LIMIT:-64M}"}
x-pulse-persistence-resources: &pulse-persistence-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_PERSISTENCE_CPU_LIMIT:-0.20}", memory: "${PULSE_PERSISTENCE_MEMORY_LIMIT:-256M}"}
x-pulse-analytics-resources: &pulse-analytics-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_ANALYTICS_CPU_LIMIT:-0.20}", memory: "${PULSE_ANALYTICS_MEMORY_LIMIT:-384M}"}
x-pulse-webhook-resources: &pulse-webhook-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_WEBHOOK_CPU_LIMIT:-0.10}", memory: "${PULSE_WEBHOOK_MEMORY_LIMIT:-192M}"}
x-pulse-kafka-resources: &pulse-kafka-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_KAFKA_CPU_LIMIT:-0.30}", memory: "${PULSE_KAFKA_MEMORY_LIMIT:-512M}"}
x-pulse-postgres-resources: &pulse-postgres-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_POSTGRES_CPU_LIMIT:-0.20}", memory: "${PULSE_POSTGRES_MEMORY_LIMIT:-384M}"}
x-pulse-redis-resources: &pulse-redis-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_REDIS_CPU_LIMIT:-0.05}", memory: "${PULSE_REDIS_MEMORY_LIMIT:-64M}"}
x-pulse-clickhouse-resources: &pulse-clickhouse-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_CLICKHOUSE_CPU_LIMIT:-0.35}", memory: "${PULSE_CLICKHOUSE_MEMORY_LIMIT:-512M}"}
x-pulse-prometheus-resources: &pulse-prometheus-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_PROMETHEUS_CPU_LIMIT:-0.05}", memory: "${PULSE_PROMETHEUS_MEMORY_LIMIT:-64M}"}
x-pulse-loki-resources: &pulse-loki-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_LOKI_CPU_LIMIT:-0.05}", memory: "${PULSE_LOKI_MEMORY_LIMIT:-64M}"}
x-pulse-tempo-resources: &pulse-tempo-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_TEMPO_CPU_LIMIT:-0.05}", memory: "${PULSE_TEMPO_MEMORY_LIMIT:-64M}"}
x-pulse-grafana-resources: &pulse-grafana-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_GRAFANA_CPU_LIMIT:-0.05}", memory: "${PULSE_GRAFANA_MEMORY_LIMIT:-128M}"}
x-pulse-mock-resources: &pulse-mock-resources
  deploy:
    resources:
      limits: {cpus: "${PULSE_MOCK_CPU_LIMIT:-0.05}", memory: "${PULSE_MOCK_MEMORY_LIMIT:-32M}"}

services:
  ingestion:
    <<: [*pulse-image, *pulse-ingestion-resources]
    restart: unless-stopped
    environment:
      <<: *pulse-environment
      PULSE_SERVICE: ingestion
    ports:
      - "127.0.0.1:${PULSE_INGESTION_PORT:-8080}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  query-api:
    <<: [*pulse-image, *pulse-query-resources]
    restart: unless-stopped
    environment:
      <<: *pulse-environment
      PULSE_SERVICE: query-api
    ports:
      - "127.0.0.1:${PULSE_QUERY_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  analytics-ui:
    image: nginx:1.27-alpine
    <<: *pulse-ui-resources
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_UI_PORT:-3001}:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      query-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  persistence-worker:
    <<: [*pulse-image, *pulse-persistence-resources]
    restart: unless-stopped
    environment:
      <<: *pulse-environment
      PULSE_SERVICE: persistence-worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  analytics-worker:
    <<: [*pulse-image, *pulse-analytics-resources]
    restart: unless-stopped
    environment:
      <<: *pulse-environment
      PULSE_SERVICE: analytics-worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  webhook-worker:
    <<: [*pulse-image, *pulse-webhook-resources]
    restart: unless-stopped
    environment:
      <<: *pulse-environment
      PULSE_SERVICE: webhook-worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.raw --partitions 12 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic events.dlq --partitions 12 --replication-factor 1

  kafka:
    image: apache/kafka:3.9.0
    <<: *pulse-kafka-resources
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    <<: *pulse-postgres-resources
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    <<: *pulse-redis-resources
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    <<: *pulse-clickhouse-resources
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${PULSE_CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/002_clickhouse.sql:/docker-entrypoint-initdb.d/002_clickhouse.sql:ro
      - ./deployments/docker/clickhouse/z-pulse.xml:/etc/clickhouse-server/users.d/z-pulse.xml:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.5.0
    <<: *pulse-prometheus-resources
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      ingestion:
        condition: service_healthy
      query-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5.0
    <<: *pulse-loki-resources
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tempo:
    image: grafana/tempo:2.7.2
    <<: *pulse-tempo-resources
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:12.1.1
    <<: *pulse-grafana-resources
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  webhook-mock:
    image: python:3.13-alpine
    <<: *pulse-mock-resources
    profiles: [e2e]
    restart: unless-stopped
    command: ["python", "/webhook_mock.py", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - ./tests/e2e/webhook_mock.py:/webhook_mock.py:ro
    ports:
      - "127.0.0.1:${PULSE_WEBHOOK_MOCK_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clickhouse-data:
  grafana-data:
  kafka-data:
  loki-data:
  postgres-data:
  prometheus-data:
  redis-data:
  tempo-data:
