<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pulse event platform architecture</title>
  <desc id="desc">A left-to-right event path from clients through the ingestion API and Kafka to independent persistence, analytics, and webhook workers. A lower support row shows Redis, the Query API, and observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#52657a"/>
    </marker>
    <style>
      .title { font-family: DejaVu Sans, sans-serif; font-size: 42px; font-weight: 700; fill: #102a43; }
      .subtitle { font-family: DejaVu Sans, sans-serif; font-size: 20px; fill: #52657a; }
      .heading { font-family: DejaVu Sans, sans-serif; font-size: 23px; font-weight: 700; fill: #102a43; }
      .body { font-family: DejaVu Sans, sans-serif; font-size: 17px; fill: #334e68; }
      .small { font-family: DejaVu Sans, sans-serif; font-size: 15px; fill: #627d98; }
      .inverse-heading { font-family: DejaVu Sans, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
      .inverse-body { font-family: DejaVu Sans, sans-serif; font-size: 16px; fill: #e6f0f7; }
      .card { stroke: #bcccdc; stroke-width: 2; }
      .flow { fill: none; stroke: #52657a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fafc"/>
  <rect x="24" y="24" width="1552" height="852" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>

  <text x="72" y="92" class="title">Pulse architecture</text>
  <text x="72" y="128" class="subtitle">One durable event path, three independent effects</text>

  <text x="72" y="182" class="small">PRIMARY EVENT PATH</text>

  <rect x="70" y="230" width="210" height="128" rx="16" fill="#e8eef4" class="card"/>
  <text x="175" y="278" text-anchor="middle" class="heading">Clients</text>
  <text x="175" y="310" text-anchor="middle" class="body">HTTP producers</text>
  <text x="175" y="336" text-anchor="middle" class="small">tenant API key</text>

  <rect x="350" y="210" width="270" height="168" rx="16" fill="#0f9d8a" stroke="#0b776b" stroke-width="2"/>
  <text x="485" y="258" text-anchor="middle" class="inverse-heading">Ingestion API</text>
  <text x="485" y="292" text-anchor="middle" class="inverse-body">auth · validate · rate limit</text>
  <text x="485" y="325" text-anchor="middle" class="inverse-body">sync Kafka publish</text>
  <text x="485" y="353" text-anchor="middle" class="inverse-body">202 after durable ack</text>

  <rect x="690" y="210" width="270" height="168" rx="16" fill="#d9822b" stroke="#b56317" stroke-width="2"/>
  <text x="825" y="258" text-anchor="middle" class="inverse-heading">Kafka</text>
  <text x="825" y="292" text-anchor="middle" class="inverse-body">events.raw</text>
  <text x="825" y="325" text-anchor="middle" class="inverse-body">key: tenantId</text>
  <text x="825" y="353" text-anchor="middle" class="inverse-body">events.dlq for terminal errors</text>

  <path d="M280 294 H350" class="flow"/>
  <path d="M620 294 H690" class="flow"/>

  <rect x="1025" y="165" width="250" height="104" rx="14" fill="#d9eaf7" class="card"/>
  <text x="1150" y="207" text-anchor="middle" class="heading">Persistence worker</text>
  <text x="1150" y="239" text-anchor="middle" class="body">idempotent writes</text>

  <rect x="1025" y="294" width="250" height="104" rx="14" fill="#e4ddf7" class="card"/>
  <text x="1150" y="336" text-anchor="middle" class="heading">Analytics worker</text>
  <text x="1150" y="368" text-anchor="middle" class="body">OLAP ingestion</text>

  <rect x="1025" y="423" width="250" height="104" rx="14" fill="#f5d9e1" class="card"/>
  <text x="1150" y="465" text-anchor="middle" class="heading">Webhook worker</text>
  <text x="1150" y="497" text-anchor="middle" class="body">retry · HMAC · SSRF</text>

  <rect x="1340" y="165" width="190" height="104" rx="14" fill="#d9e2ec" class="card"/>
  <text x="1435" y="207" text-anchor="middle" class="heading">PostgreSQL</text>
  <text x="1435" y="239" text-anchor="middle" class="body">operational state</text>

  <rect x="1340" y="294" width="190" height="104" rx="14" fill="#d9e2ec" class="card"/>
  <text x="1435" y="336" text-anchor="middle" class="heading">ClickHouse</text>
  <text x="1435" y="368" text-anchor="middle" class="body">analytics</text>

  <rect x="1340" y="423" width="190" height="104" rx="14" fill="#f1d4d4" class="card"/>
  <text x="1435" y="465" text-anchor="middle" class="heading">External APIs</text>
  <text x="1435" y="497" text-anchor="middle" class="body">signed webhooks</text>

  <path d="M960 294 C985 294 990 217 1025 217" class="flow"/>
  <path d="M960 294 H1025" class="flow"/>
  <path d="M960 294 C985 294 990 475 1025 475" class="flow"/>
  <path d="M1275 217 H1340" class="flow"/>
  <path d="M1275 346 H1340" class="flow"/>
  <path d="M1275 475 H1340" class="flow"/>

  <text x="72" y="590" class="small">SUPPORTING SERVICES</text>

  <rect x="70" y="625" width="330" height="125" rx="16" fill="#e0f2ef" class="card"/>
  <text x="235" y="670" text-anchor="middle" class="heading">Redis</text>
  <text x="235" y="704" text-anchor="middle" class="body">distributed rate limiting</text>
  <text x="235" y="730" text-anchor="middle" class="small">shared across API replicas</text>

  <rect x="440" y="625" width="330" height="125" rx="16" fill="#e6eef7" class="card"/>
  <text x="605" y="670" text-anchor="middle" class="heading">Analytics UI</text>
  <text x="605" y="704" text-anchor="middle" class="body">tenant-scoped analytics</text>
  <text x="605" y="730" text-anchor="middle" class="small">through the Query API</text>

  <rect x="810" y="625" width="720" height="125" rx="16" fill="#102a43" stroke="#102a43" stroke-width="2"/>
  <text x="1170" y="670" text-anchor="middle" class="inverse-heading">Observability</text>
  <text x="1170" y="704" text-anchor="middle" class="inverse-body">Prometheus · Grafana · Tempo · Loki</text>
  <text x="1170" y="730" text-anchor="middle" class="inverse-body">metrics · traces · logs</text>

  <text x="72" y="820" class="small">Semantics: at-least-once delivery · idempotent consumers · eventual consistency · no end-to-end exactly-once guarantee</text>
</svg>
